type: Design Pattern
subtype: Property Design Pattern
id: PDP107 # https://github.com/mabablue/I-ADOPT-patterns-playground/blob/main/pattern/PDP107.yaml
name: length ref
definition: >-
  Length in relation to another object. Length is a fundamental property.
  Examples are width, depth, height, circumference.
design: >-
  The property represents a spatial extent or distance requiring a reference point.
CT: CTP68 # https://github.com/mabablue/I-ADOPT-patterns-playground/blob/main/pattern/CTP68.yaml  
