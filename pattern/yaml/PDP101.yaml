type: Design Pattern
subtype: Property Design Pattern
id: PDP101 # https://github.com/mabablue/I-ADOPT-patterns-playground/blob/main/pattern/PDP101.yaml
name: nominal
definition: >-
  A nominal variable has values of equal importance that cannot be ranked in
  any particular order (non-ordinal), e.g., species of pests, colors. The values
  of these variables are usually indicated by words, ideally using controlled lists.
design: The property must be specific.
gh_issue: 1 # https://github.com/mabablue/I-ADOPT-examples-playground/issues/1
