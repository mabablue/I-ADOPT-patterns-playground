id: https://github.com/mabablue/I-ADOPT-patterns-playground/blob/main/pattern/VDP132.yaml
name: index
definition: An index acts as a proxy property that normalizes data against a specific base point or reference value to provide relative context rather than absolute measurement. While it sometimes aggregates multiple variables into a single score, its primary function is to make diverse data sets comparable over time or across different subjects.
design: Index must be specified (e.g. body mass index). OoI is a single entity.
