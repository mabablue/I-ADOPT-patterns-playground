name: direction
definition: A constraint that specifies the spatial orientation, vector heading, or flow orientation (e.g., downward, northward, incoming, outward) of the observed phenomenon relative to a spatial coordinate system, physical boundary, or reference feature. When the direction is defined relative to an absolute, globally understood coordinate system, a reference constraint is redundant and unnecessary. 
